version: '3.8'
services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=didistribuidores
      - TIMEOUT_PAGO_SEG=30
      - TIMEOUT_ASIGNACION_SEG=60
    depends_on:
      - db
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: didistribuidores
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=didistribuidores
      - TIMEOUT_PAGO_SEG=30
      - TIMEOUT_ASIGNACION_SEG=60
      - REVISION_TIMEOUTS_SEG=5
      - OUTBOX_ACTIVO=1
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: didistribuidores
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 es importante: durante la inicialización Postgres corre un servidor
      # temporal que solo acepta conexiones por socket. Por TCP solo responde el definitivo,
      # cuando ya terminaron los scripts de db/.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d didistribuidores"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=didistribuidores
      - TIMEOUT_PAGO_SEG=30
      - TIMEOUT_ASIGNACION_SEG=60
      - REVISION_TIMEOUTS_SEG=5
      - OUTBOX_ACTIVO=1
      - RABBITMQ_URL=amqp://sd:sd@rabbitmq:5672/
      - PUBLICADOR_ACTIVO=1
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notificaciones:
    build: ./notificaciones
    ports:
      - "8001:8000"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASS=postgres
      - DB_NAME=notificaciones_db
      - RABBITMQ_URL=amqp://sd:sd@rabbitmq:5672/
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # El hostname fijo es necesario: RabbitMQ guarda sus datos según el nombre del nodo,
    # y sin esto cambia en cada contenedor nuevo y las colas persistentes "desaparecen".
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: sd
      RABBITMQ_DEFAULT_PASS: sd
    ports:
      - "15672:15672"   # consola web: http://localhost:15672 (usuario sd, contraseña sd)
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: didistribuidores
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: durante la inicialización Postgres corre un servidor temporal que solo
      # acepta conexiones por socket. Por TCP solo responde el definitivo, ya con los scripts listos.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d didistribuidores"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  rabbitmqdata:
